name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
  checks: write
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: "*/go.sum"

      - name: Build and run unit tests
        run: |
          for service in gateway cars-service rental-service payment-service; do
            echo "::group::$service"
            (cd "$service" && go vet ./... && go build ./... && go test ./...)
            echo "::endgroup::"
          done

      - name: Build images
        timeout-minutes: 10
        run: docker compose build --push

      # TODO deploy to k8s with liveness and readyness probes

      - name: Wait before services are ready
        run: kubectl wait -n test -l app.kubernetes.io/name=gateway pod --for=condition=Ready --timeout 3m
      
      # TODO setup parameters in classroom/autograding.json
      
      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true
