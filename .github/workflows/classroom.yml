name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: "*/go.sum"

      - name: Build and run unit tests
        run: |
          for service in gateway cars-service rental-service payment-service; do
            echo "::group::$service"
            (cd "$service" && go vet ./... && go build ./... && go test ./...)
            echo "::endgroup::"
          done

  deploy:
    name: Deploy and run v3
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_NAMESPACE: ${{ vars.DEPLOY_NAMESPACE || secrets.DEPLOY_NAMESPACE || 'test' }}
    concurrency:
      group: lab4-cloud-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images
        timeout-minutes: 10
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose build --push

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.4

      - name: Connect to Cloud.ru
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          test -n "$KUBECONFIG_CONTENT" || { echo 'Set the KUBECONFIG secret'; exit 1; }
          umask 077
          config="$RUNNER_TEMP/cloudru-kubeconfig.yaml"
          printf '%s\n' "$KUBECONFIG_CONTENT" > "$config"
          if [[ "$(kubectl --kubeconfig "$config" config view --minify -o jsonpath='{.users[0].user.exec.command}')" == cloudlogin ]]; then
            curl --fail --silent --show-error --location --retry 3 \
              https://github.com/cloud-ru-tech/cloudlogin/releases/latest/download/cloudlogin_Linux_amd64.tar.gz \
              -o "$RUNNER_TEMP/cloudlogin.tar.gz"
            tar -xzf "$RUNNER_TEMP/cloudlogin.tar.gz" -C "$RUNNER_TEMP" ./cloudlogin
            chmod +x "$RUNNER_TEMP/cloudlogin"
            export PATH="$RUNNER_TEMP:$PATH"
            echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          fi
          echo "KUBECONFIG=$config" >> "$GITHUB_ENV"
          kubectl --kubeconfig "$config" --request-timeout=20s -n "$DEPLOY_NAMESPACE" get deployments

      - name: Deploy with Helm
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for secret in postgres-auth database-urls; do
            kubectl -n "$DEPLOY_NAMESPACE" get secret "$secret" -o name
          done
          helm upgrade --install postgres ./k8s/postgres -n "$DEPLOY_NAMESPACE" --wait --timeout 5m
          for app in cars-service rental-service payment-service gateway; do
            helm upgrade --install "$app" ./k8s/service -n "$DEPLOY_NAMESPACE" --wait --timeout 3m \
              -f "./k8s/values/$app.yaml" --set-string "image.tag=$IMAGE_TAG"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run v3 through Ingress
        timeout-minutes: 8
        env:
          EXTERNAL_IP: ${{ secrets.EXTERNAL_IP }}
        run: |
          test -n "$EXTERNAL_IP" || { echo 'Set the EXTERNAL_IP secret'; exit 1; }
          case "$EXTERNAL_IP" in
            http://*|https://*) base_url="${EXTERNAL_IP%/}" ;;
            *) base_url="http://${EXTERNAL_IP%/}" ;;
          esac
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
            --retry 10 --retry-all-errors --retry-delay 3 "$base_url/manage/health"
          npm install --global newman@6
          file=v3/postman/environment.json
          jq --arg url "$base_url" '(.values[] | select(.key == "baseUrl") | .value) = $url' "$file" > "$file.tmp"
          mv "$file.tmp" "$file"
          bash ./scripts/test-script.sh v3 payment-service "$DEPLOY_NAMESPACE"
